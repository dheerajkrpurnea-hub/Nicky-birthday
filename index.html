<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Nicky Kumari</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px 20px;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            width: 85%;
            max-width: 360px;
            text-align: center;
            color: #4A4A4A;
        }
        .sub-title {
            letter-spacing: 2px;
            font-size: 13px;
            color: #888;
            font-weight: 600;
        }
        .name {
            font-family: 'Brush Script MT', cursive, sans-serif;
            font-size: 38px;
            color: #E91E63;
            margin: 10px 0 20px;
        }
        .date-box {
            background: #FFF0F3;
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 20px;
        }
        .tag {
            background: #FF2E63;
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 8px;
        }
        .btn {
            background: linear-gradient(45deg, #FF2E63, #FF6B8B);
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 46, 99, 0.3);
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="sub-title">SOMEONE SPECIAL HAS A SURPRISE</div>
        <div class="name">Nicky Kumari</div>
        
        <div class="date-box">
            <span class="tag">📅 5TH OCTOBER</span>
            <div style="color: #4A4A4A; font-weight: bold; font-size: 15px;">The Magic Day Is Here!</div>
        </div>

        <p style="font-size: 14px; color: #666; line-height: 1.5;">
            A special experience crafted<br>just for you on your birthday! ✨
        </p>

        <button class="btn" onclick="alert('Happy Birthday Nicky! 🎉')">Tap To Start ✨</button>
    </div>

</body>
</html>
